const ToastCtx=createContext(null);function useToast(){return useContext(ToastCtx)}

async function updateCariBakiye(cariId,{bakiyeDelta=0,avansDelta=0}){const ref=db.collection(COL.cariler).doc(cariId);await db.runTransaction(async t=>{const snap=await t.get(ref);if(!snap.exists)throw new Error("Cari bulunamadı");const c=snap.data();const bakiye=n(c.bakiye)+bakiyeDelta;const avansBakiye=Math.max(0,n(c.avansBakiye)+avansDelta);t.update(ref,{bakiye,avansBakiye})})}

function Field({label,children,className=""}){return(<label className={`block ${className}`}><span className="mb-1 block text-xs font-bold text-slate-700">{label}</span>{children}</label>)}

function DataTable({columns,rows,rowKey,actions,empty}){const[sort,setSort]=useState({key:null,dir:"desc"});const data=useMemo(()=>{if(!sort.key)return rows;const col=columns.find(c=>c.key===sort.key);return[...rows].sort((a,b)=>{const va=col&&col.get?col.get(a):a[sort.key];const vb=col&&col.get?col.get(b):b[sort.key];const na=Number(String(va).replace(/[^0-9\-\.]/g,"")),nb=Number(String(vb).replace(/[^0-9\-\.]/g,""));let cmp=(!isNaN(na)&&!isNaN(nb)&&va!==""&&vb!=="")?na-nb:String(va||"").localeCompare(String(vb||""),"tr");return sort.dir==="asc"?cmp:-cmp})},[rows,sort,columns]);return(<div className="table-wrap overflow-auto rounded-xl border border-slate-200 bg-white shadow-soft scroll-thin" style={{maxHeight:"calc(100vh - 280px)"}}><table className="min-w-full text-sm"><thead><tr>{columns.map(c=>(<th key={c.key} onClick={()=>setSort(s=>({key:c.key,dir:s.key===c.key&&s.dir==="asc"?"desc":"asc"}))} className="cursor-pointer whitespace-nowrap border-b border-slate-200 bg-slate-900 px-3 py-2.5 text-left text-[11px] font-bold uppercase tracking-wide text-white">{c.header}{sort.key===c.key?(sort.dir==="asc"?" ↑":" ↓"):""}</th>))}{actions&&<th className="border-b border-slate-200 bg-slate-900 px-3 py-2.5 text-right text-[11px] font-bold uppercase text-white">İşlem</th>}</tr></thead><tbody>{data.length===0&&(<tr><td colSpan={columns.length+(actions?1:0)} className="px-3 py-10 text-center text-sm text-slate-400">{empty||"Kayıt bulunamadı"}</td></tr>)}{data.map((r,i)=>(<tr key={rowKey?rowKey(r):r.id||i} className="hover:bg-blue-50/60 border-b border-slate-100 last:border-0">{columns.map(c=>(<td key={c.key} className="whitespace-nowrap border-b border-slate-100 px-3 py-2 text-slate-800">{c.render?c.render(r):(c.get?c.get(r):r[c.key])}</td>))}{actions&&<td className="border-b border-slate-100 px-3 py-2 text-right">{actions(r)}</td>}</tr>))}</tbody></table></div>)}

-posta"><input className={inp} type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="ornek@firma.com"/></Field><Field label="Şifre"><input className={inp} type="password" value={pass} onChange={e=>setPass(e.target.value)} required placeholder="••••••••"/></Field><button className={`${btnP} w-full py-2.5`} disabled={busy}>{busy?"Giriş yapılıyor...":"Giriş Yap"}</button><button type="button" className="w-full text-center text-sm font-bold text-blue-700 hover:underline" onClick={()=>{setForgot(true);setFemail(email)}}>Şifremi Unuttum</button></form>):(<form onSubmit={reset} className="mt-6 space-y-3"><Field label="E-posta"><input className={inp} type="email" value={femail} onChange={e=>setFemail(e.target.value)} required placeholder="ornek@firma.com"/></Field><button className={`${btnP} w-full py-2.5`} disabled={busy}>{busy?"Gönderiliyor...":"Şifre Sıfırlama Bağlantısı Gönder"}</button><button type="button" className="w-full text-center text-sm font-bold text-blue-700 hover:underline" onClick={()=>setForgot(false)}>Girişe dön</button></form>)}</div></div></div>)}

function Dashboard(){const d=useData();const today=todayISO();const month=today.slice(0,7);
const kToday=d.kantar.filter(x=>isoOf(x)===today);const kMonth=d.kantar.filter(x=>isoOf(x).startsWith(month));
const gelirAy=d.gelirGider.filter(x=>x.tip==="gelir"&&isoOf(x).startsWith(month)).reduce((s,x)=>s+n(x.tutar),0);
const giderAy=d.gelirGider.filter(x=>x.tip==="gider"&&isoOf(x).startsWith(month)).reduce((s,x)=>s+n(x.tutar),0);
const alacak=d.cariler.reduce((s,c)=>s+Math.max(0,n(c.bakiye)),0);
const tonBugun=kToday.reduce((s,x)=>s+n(x.miktar),0);const satisBugun=kToday.reduce((s,x)=>s+n(x.kdvLi),0);
const barRef=useRef(null);const lineRef=useRef(null);const doughRef=useRef(null);const chartsRef=useRef([]);
useEffect(()=>{
if(!window.Chart)return;
chartsRef.current.forEach(c=>{try{c.destroy()}catch(e){}});chartsRef.current=[];
const months=[];for(let i=5;i>=0;i--){const dt=new Date();dt.setMonth(dt.getMonth()-i);months.push(`${dt.getFullYear()}-${pad(dt.getMonth()+1)}`)}
const ayAd=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const labels=months.map(m=>{const[y,mo]=m.split("-").map(Number);return `${ayAd[mo-1]} ${String(y).slice(2)}`});
const tonData=months.map(m=>d.kantar.filter(k=>isoOf(k).startsWith(m)).reduce((s,k)=>s+n(k.miktar),0));
const satisData=months.map(m=>d.kantar.filter(k=>isoOf(k).startsWith(m)).reduce((s,k)=>s+n(k.kdvLi),0));
const gelirData=months.map(m=>d.gelirGider.filter(k=>k.tip==="gelir"&&isoOf(k).startsWith(m)).reduce((s,k)=>s+n(k.tutar),0));
const giderData=months.map(m=>d.gelirGider.filter(k=>k.tip==="gider"&&isoOf(k).startsWith(m)).reduce((s,k)=>s+n(k.tutar),0));
if(barRef.current){chartsRef.current.push(new window.Chart(barRef.current,{type:"bar",data:{labels,datasets:[{label:"Ton",data:tonData,backgroundColor:"#2563EB",borderRadius:8},{label:"Satış (Bin ₺)",data:satisData.map(v=>+(v/1000).toFixed(1)),backgroundColor:"#0F172A",borderRadius:8}]},options:{plugins:{legend:{position:"bottom"}},scales:{y:{beginAtZero:true}},maintainAspectRatio:false}}))}
if(lineRef.current){chartsRef.current.push(new window.Chart(lineRef.current,{type:"line",data:{labels,datasets:[{label:"Gelir",data:gelirData,borderColor:"#059669",backgroundColor:"rgba(5,150,105,.15)",fill:true,tension:.4},{label:"Gider",data:giderData,borderColor:"#E11D48",backgroundColor:"rgba(225,29,72,.12)",fill:true,tension:.4}]},options:{plugins:{legend:{position:"bottom"}},scales:{y:{beginAtZero:true}},maintainAspectRatio:false}}))}
const prodMap={};d.kantar.forEach(k=>{prodMap[k.urun||"Diğer"]=(prodMap[k.urun||"Diğer"]||0)+n(k.miktar)});
const pLabels=Object.keys(prodMap).slice(0,7);const pData=pLabels.map(l=>+prodMap[l].toFixed(1));
if(doughRef.current){chartsRef.current.push(new window.Chart(doughRef.current,{type:"doughnut",data:{labels:pLabels.length?pLabels:["Veri yok"],datasets:[{data:pData.length?pData:[1],backgroundColor:["#0F172A","#2563EB","#60A5FA","#059669","#F59E0B","#E11D48","#7C3AED"]}]},options:{plugins:{legend:{position:"bottom"}},maintainAspectRatio:false}}))}
return()=>{chartsRef.current.forEach(c=>{try{c.destroy()}catch(e){}})}
},[d.kantar,d.gelirGider]);
const topCariler=[...d.cariler].sort((a,b)=>n(b.bakiye)-n(a.bakiye)).slice(0,5);
const sonFisler=sortByDate(d.kantar).slice(0,7);
return(<div className="fade-in">
<PageHead title="Ana Sayfa" desc={`${formatDateTR(today)} • Günlük ocak özeti ve grafikler`} cards={[<StatCard key="1" dark label="Kasa Bakiyesi" value={money(d.kasaBakiye)} sub="Anlık"/>,<StatCard key="2" label="Cari Alacak" value={money(alacak)} sub={`${d.cariler.length} cari`}/>,<StatCard key="3" blue label="Bugün Ton" value={num(tonBugun)} sub={`${kToday.length} fiş`}/>,<StatCard key="4" label="Bugün Satış" value={money(satisBugun)} sub="KDV'li"/>]}/>
<div className="grid gap-3 lg:grid-cols-3">
<div className="lg:col-span-2 rounded-2xl bg-white border border-slate-200 p-4 shadow-soft"><div className="flex items-center justify-between mb-2"><div className="font-extrabold text-slate-900">Son 6 Ay — Ton & Satış</div><span className="text-[11px] font-bold bg-slate-900 text-white px-2 py-1 rounded-full">CANLI</span></div><div className="h-[260px]"><canvas ref={barRef}></canvas></div></div>
<div className="rounded-2xl bg-white border border-slate-200 p-4 shadow-soft"><div className="font-extrabold text-slate-900 mb-2">Ürün Dağılımı (Ton)</div><div className="h-[260px]"><canvas ref={doughRef}></canvas></div></div>
</div>
<div className="mt-3 grid gap-3 lg:grid-cols-3">
<div className="lg:col-span-2 rounded-2xl bg-white border border-slate-200 p-4 shadow-soft"><div className="font-extrabold text-slate-900 mb-2">Gelir — Gider Trendi (Son 6 Ay)</div><div className="h-[230px]"><canvas ref={lineRef}></canvas></div><div className="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2 text-sm"><div className="rounded-xl bg-slate-50 border p-3"><div className="text-[11px] font-bold text-slate-500">BU AY SATIŞ</div><div className="font-extrabold">{money(kMonth.reduce((s,x)=>s+n(x.kdvLi),0))}</div></div><div className="rounded-xl bg-slate-50 border p-3"><div className="text-[11px] font-bold text-slate-500">BU AY TON</div><div className="font-extrabold">{num(kMonth.reduce((s,x)=>s+n(x.miktar),0))}</div></div><div className="rounded-xl bg-emerald-50 border border-emerald-100 p-3"><div className="text-[11px] font-bold text-emerald-700">GELİR</div><div className="font-extrabold text-emerald-700">{money(gelirAy)}</div></div><div className="rounded-xl bg-rose-50 border border-rose-100 p-3"><div className="text-[11px] font-bold text-rose-700">GİDER</div><div className="font-extrabold text-rose-700">{money(giderAy)}</div></div></div></div>
<div className="space-y-3">
<div className="rounded-2xl bg-slate-900 text-white p-4 shadow-soft"><div className="font-bold mb-2">En Yüksek Bakiyeli Cariler</div>{topCariler.map(c=>(<div key={c.id} className="flex justify-between border-b border-white/10 py-1.5 text-sm last:border-0"><span className="truncate pr-2">{c.ad}</span><span className="font-bold">{money(c.bakiye)}</span></div>))}{topCariler.length===0&&<div className="text-sm text-white/60">Henüz cari yok</div>}</div>
<div className="rounded-2xl bg-white border border-slate-200 p-4 shadow-soft"><div className="font-bold mb-2">Son Kantar Fişleri</div>{sonFisler.map(k=>(<div key={k.id} className="flex justify-between border-b border-slate-100 py-1.5 text-[13px] last:border-0"><span className="truncate pr-2">{formatDateTR(k.tarih)} • {k.cariAd} • {k.urun}</span><span className="font-bold whitespace-nowrap">{num(k.miktar)} t</span></div>))}{sonFisler.length===0&&<div className="text-sm text-slate-400">Henüz fiş yok</div>}</div>
</div>
</div>
</div>)}
/* KANTAR */
function KantarPage(){const d=useData();const toast=useToast();const[search,setSearch]=useState("");const[from,setFrom]=useState("");const[to,setTo]=useState("");const[open,setOpen]=useState(false);const[edit,setEdit]=useState(null);const[pay,setPay]=useState(null);const[del,setDel]=useState(null);const[form,setForm]=useState({tarih:todayISO(),fisNo:"",aciklama:"",cariId:"",plaka:"",urun:"Mıcır 5-12",miktar:"",birimFiyat:"",kdvOran:KDV_DEFAULT});const f=(k,v)=>setForm(s=>({...s,[k]:v}));const kdvSiz=n(form.miktar)*n(form.birimFiyat);const kdvLi=kdvSiz*(1+n(form.kdvOran)/100);
const rows=useMemo(()=>sortByDate(d.kantar).filter(r=>{if(!inRange(isoOf(r),from,to))return false;const q=search.toLowerCase();if(!q)return true;return[fisNo(r),r.cariAd,r.urun,r.aciklama,r.plaka].join(" ").toLowerCase().includes(q);function fisNo(x){return x.fisNo||""}}),[d.kantar,search,from,to]);
const tot=rows.reduce((s,r)=>({t:s.t+n(r.miktar),a:s.a+n(r.kdvSiz),b:s.b+n(r.kdvLi)}),{t:0,a:0,b:0});
function startNew(){setEdit(null);setForm({tarih:todayISO(),fisNo:"",aciklama:"",cariId:"",plaka:"",urun:"Mıcır 5-12",miktar:"",birimFiyat:"",kdvOran:KDV_DEFAULT});setOpen(true)}
async function save(e){e.preventDefault();try{await d.actions.saveKantar({...form,kdvSiz,kdvLi},edit);toast("Kantar fişi kaydedildi, cari hesabına işlendi.");setOpen(false)}catch(err){toast(err.message,"err")}}
async function doPay(e){e.preventDefault();try{await d.actions.tahsilat({cariId:pay.cariId,tutar:pay._tutar,aciklama:pay._ack||`Tahsilat - Fiş ${pay.fisNo}`,odemeYontemi:pay._odeme,tarih:todayISO(),kantarFisId:pay.id});toast("Tahsilat cari, gelir ve kasaya tek işlem olarak işlendi.");setPay(null)}catch(err){toast(err.message,"err")}}
const cols=[{key:"tarih",header:"Tarih",get:r=>formatDateTR(r.tarih),excel:r=>formatDateTR(r.tarih)},{key:"fisNo",header:"Fiş No",excel:"fisNo"},{key:"cariAd",header:"Cari",excel:"cariAd"},{key:"plaka",header:"Plaka",excel:"plaka"},{key:"urun",header:"Ürün",excel:"urun"},{key:"miktar",header:"Ton",render:r=>num(r.miktar),excel:r=>n(r.miktar)},{key:"birimFiyat",header:"Birim Fiyat",render:r=>money(r.birimFiyat),excel:r=>n(r.birimFiyat)},{key:"kdvSiz",header:"KDV'siz",render:r=>money(r.kdvSiz),excel:r=>n(r.kdvSiz)},{key:"kdvLi",header:"KDV'li",render:r=>money(r.kdvLi),excel:r=>n(r.kdvLi)},{key:"durum",header:"Tahsilat",render:r=>r.tahsilatId?<span className="rounded-full bg-emerald-600 text-white px-2 py-0.5 text-[11px] font-bold">Alındı</span>:<span className="rounded-full bg-slate-900 text-white px-2 py-0.5 text-[11px] font-bold">Açık</span>,excel:r=>r.tahsilatId?"Alındı":"Açık"}];
return(<div className="fade-in"><PageHead title="Kantar Fişleri" desc="Satış fişleri cariye otomatik işlenir • Avans varsa önce avanstan düşer" cards={[<StatCard key="t" dark label="Toplam Ton" value={num(tot.t)}/>,<StatCard key="a" label="Toplam (KDV'siz)" value={money(tot.a)}/>,<StatCard key="b" blue label="Toplam (KDV'li)" value={money(tot.b)}/>]}/>
<Toolbar search={search} setSearch={setSearch} from={from} setFrom={setFrom} to={to} setTo={setTo} onAdd={startNew} addLabel="Yeni Kayıt Oluştur" onExcel={()=>exportExcel(rows,cols,"Kantar_Fisleri")}/>
<DataTable columns={cols} rows={rows} actions={r=>(<div className="flex justify-end gap-1">{!r.tahsilatId&&<button className={`${btn} bg-emerald-600 text-white hover:bg-emerald-700 px-2 py-1`} onClick={()=>setPay({...r,_tutar:r.borcEklenen||r.kdvLi,_odeme:"Nakit",_ack:""})}>Tahsilat Yap</button>}<button className={btnS+" px-2 py-1"} onClick={()=>{setEdit(r.id);setForm({...r});setOpen(true)}}><Icon name="edit" className="w-4 h-4"/></button><button className={btnD+" px-2 py-1"} onClick={()=>setDel(r)}><Icon name="trash" className="w-4 h-4"/></button></div>)}/>
<Modal open={open} title={edit?"Kantar Fişi Düzenle":"Yeni Kantar Fişi"} onClose={()=>setOpen(false)} wide><form onSubmit={save} className="grid grid-cols-1 gap-3 sm:grid-cols-2"><Field label="Tarih"><input type="date" className={inp} value={form.tarih} onChange={e=>f("tarih",e.target.value)} required/></Field><Field label="Fiş Numarası"><input className={inp} value={form.fisNo} onChange={e=>f("fisNo",e.target.value)} required/></Field><Field label="Cari" className="sm:col-span-2"><select className={inp} value={form.cariId} onChange={e=>f("cariId",e.target.value)} required><option value="">Seçiniz</option>{[...d.cariler].sort((a,b)=>a.ad.localeCompare(b.ad,"tr")).map(c=><option key={c.id} value={c.id}>{c.ad}</option>)}</select></Field><Field label="Plaka"><input className={inp} value={form.plaka||""} onChange={e=>f("plaka",e.target.value)}/></Field><Field label="Ürün"><input className={inp} list="urunler" value={form.urun} onChange={e=>f("urun",e.target.value)}/><datalist id="urunler">{URUNLER.map(u=><option key={u} value={u}/>)}</datalist></Field><Field label="Miktar / Ton"><input type="number" step="0.01" className={inp} value={form.miktar} onChange={e=>f("miktar",e.target.value)} required/></Field><Field label="Birim Fiyat (TL)"><input type="number" step="0.01" className={inp} value={form.birimFiyat} onChange={e=>f("birimFiyat",e.target.value)} required/></Field><Field label="KDV %"><input type="number" step="1" className={inp} value={form.kdvOran} onChange={e=>f("kdvOran",e.target.value)}/></Field><Field label="KDV'siz Fiyat"><input className={inp} value={money(kdvSiz)} readOnly/></Field><Field label="KDV'li Fiyat"><input className={inp} value={money(kdvLi)} readOnly/></Field><Field label="Açıklama" className="sm:col-span-2"><input className={inp} value={form.aciklama} onChange={e=>f("aciklama",e.target.value)}/></Field><div className="sm:col-span-2"><FormActions onCancel={()=>setOpen(false)}/></div></form></Modal>
<Modal open={!!pay} title="Tahsilat Yap" onClose={()=>setPay(null)}>{pay&&(<form onSubmit={doPay} className="space-y-3"><p className="text-sm"><b>{pay.cariAd}</b> • Fiş {pay.fisNo} • {money(pay.kdvLi)}</p><p className="text-xs bg-slate-900 text-white rounded-lg px-3 py-2">Kalan borç (avans düşülmüş): {money(pay.borcEklenen)}</p><Field label="Tutar"><input type="number" step="0.01" className={inp} value={pay._tutar} onChange={e=>setPay({...pay,_tutar:e.target.value})} required/></Field><Field label="Ödeme Yöntemi"><select className={inp} value={pay._odeme} onChange={e=>setPay({...pay,_odeme:e.target.value})}>{OdemeYontemleri.map(o=><option key={o}>{o}</option>)}</select></Field><Field label="Açıklama"><input className={inp} value={pay._ack} onChange={e=>setPay({...pay,_ack:e.target.value})}/></Field><FormActions onCancel={()=>setPay(null)} saveLabel="Tahsilatı Kaydet"/></form>)}</Modal>
<Confirm open={!!del} title="Fişi sil" text="Fiş ve bağlı cari hareketi geri alınacak. Emin misiniz?" onNo={()=>setDel(null)} onYes={async()=>{try{await d.actions.deleteKantar(del.id);toast("Fiş silindi.")}catch(e){toast(e.message,"err")}setDel(null)}}/>
</div>)}
function CarilerPage(){const d=useData();const toast=useToast();const[search,setSearch]=useState("");const[open,setOpen]=useState(false);const[edit,setEdit]=useState(null);const[form,setForm]=useState({ad:"",vkn:"",telefon:"",adres:"",yetkili:"",aciklama:""});const[detay,setDetay]=useState(null);const[del,setDel]=useState(null);const[avans,setAvans]=useState(null);const[pay,setPay]=useState(null);

function FaturalarPage(){const d=useData();const toast=useToast();const[search,setSearch]=useState("");const[from,setFrom]=useState("");const[to,setTo]=useState("");const[open,setOpen]=useState(false);const[edit,setEdit]=useState(null);const[del,setDel]=useState(null);

const rows=sortByDate(d.faturalar).filter(r=>inRange(isoOf(r),from,to)&&[r.faturaNo,r.unvan,r.urun,r.vkn].join(" ").toLowerCase().includes(search.toLowerCase()));

return(<div className="fade-in"><PageHead title="Faturalar" cards={[<StatCard key="t" dark label="Toplam Ton" value={num(tot.t)}/>,<StatCard key="a" label="KDV'siz" value={money(tot.a)}/>,<StatCard key="b" blue label="KDV'li" value={money(tot.b)}/>]}/>

function SevkPage(){const d=useData();const toast=useToast();const[search,setSearch]=useState("");const[busy,setBusy]=useState(false);const fileRef=useRef(null);
const rows=[...d.sevk].sort((a,b)=>(b.createdAtMs||0)-(a.createdAtMs||0)).filter(r=>(r.dosyaAdi||"").toLowerCase().includes(search.toLowerCase()));
async function up(e){const f=e.target.files[0];if(!f)return;setBusy(true);try{await d.actions.uploadSevk(f);toast("PDF arşive eklendi.")}catch(err){toast(err.message,"err")}finally{setBusy(false);e.target.value=""}}
return(<div className="fade-in"><PageHead title="Sevk Fişleri" desc="PDF arşivi • Storage + Firestore ilişkili" cards={[<StatCard key="n" dark label="Dosya Sayısı" value={rows.length}/>]}/>
<div className="mb-3 flex flex-wrap gap-2 bg-white border border-slate-200 rounded-xl p-3 shadow-soft"><div className="relative flex-1 min-w-[200px]"><span className="absolute left-3 top-2.5 text-slate-400"><Icon name="search" className="w-4 h-4"/></span><input className={`${inp} pl-9`} placeholder="Dosya adına göre ara..." value={search} onChange={e=>setSearch(e.target.value)}/></div><input ref={fileRef} type="file" accept="application/pdf" className="hidden" onChange={up}/><button className={btnP} disabled={busy} onClick={()=>fileRef.current.click()}>{busy?"Yükleniyor...":"PDF Yükle"}</button></div>
<DataTable columns={[{key:"dosyaAdi",header:"Dosya Adı"},{key:"tarih",header:"Yüklenme",get:r=>formatDateTR(r.tarih)}]} rows={rows} actions={r=>(<div className="flex justify-end gap-1"><a href={r.url} target="_blank" className={btnS+" px-2 py-1"}>İndir</a><button className={btnD+" px-2 py-1"} onClick={async()=>{if(confirm("Silinsin mi?")){await d.actions.deleteSevk(r);toast("Silindi.")}}}><Icon name="trash" className="w-4 h-4"/></button></div>)}/>
</div>)}
function SanayiPage(){const d=useData();const toast=useToast();const[search,setSearch]=useState("");const[from,setFrom]=useState("");const[to,setTo]=useState("");const[open,setOpen]=useState(false);const[edit,setEdit]=useState(null);const[del,setDel]=useState(null);
const blank={tarih:todayISO(),fisNo:"",aciklama:"",teslimAlan:"",miktar:"",fiyat:"",alinan:"",verilen:""};const[form,setForm]=useState(blank);
const rows=sortByDate(d.sanayi).filter(r=>inRange(isoOf(r),from,to)&&[r.fisNo,r.aciklama,r.teslimAlan].join(" ").toLowerCase().includes(search.toLowerCase()));
const totA=rows.reduce((s,r)=>s+n(r.alinan),0);const totV=rows.reduce((s,r)=>s+n(r.verilen),0);
const cols=[{key:"tarih",header:"Tarih",get:r=>formatDateTR(r.tarih),excel:r=>formatDateTR(r.tarih)},{key:"fisNo",header:"Fiş/Fatura No",excel:"fisNo"},{key:"aciklama",header:"Açıklama",excel:"aciklama"},{key:"teslimAlan",header:"Teslim Alan",excel:"teslimAlan"},{key:"miktar",header:"Miktar",excel:r=>n(r.miktar)},{key:"fiyat",header:"Fiyat",render:r=>money(r.fiyat),excel:r=>n(r.fiyat)},{key:"alinan",header:"Alınan",render:r=>money(r.alinan),excel:r=>n(r.alinan)},{key:"verilen",header:"Verilen",render:r=>money(r.verilen),excel:r=>n(r.verilen)}];
return(<div className="fade-in"><PageHead title="Sanayi Giderleri" cards={[<StatCard key="a" label="Toplam Alınan" value={money(totA)}/>,<StatCard key="v" dark label="Toplam Verilen" value={money(totV)}/>]}/>
<Toolbar search={search} setSearch={setSearch} from={from} setFrom={setFrom} to={to} setTo={setTo} onAdd={()=>{setEdit(null);setForm(blank);setOpen(true)}} addLabel="Yeni Kayıt" onExcel={()=>exportExcel(rows,cols,"Sanayi")}/>
<DataTable columns={cols} rows={rows} actions={r=>(<div className="flex justify-end gap-1"><button className={btnS+" px-2 py-1"} onClick={()=>{setEdit(r.id);setForm(r);setOpen(true)}}><Icon name="edit" className="w-4 h-4"/></button><button className={btnD+" px-2 py-1"} onClick={()=>setDel(r)}><Icon name="trash" className="w-4 h-4"/></button></div>)}/>
<Modal open={open} title="Sanayi Kaydı" onClose={()=>setOpen(false)}><form onSubmit={async e=>{e.preventDefault();try{await d.actions.saveSanayi(form,edit);toast("Kaydedildi.");setOpen(false)}catch(err){toast(err.message,"err")}}} className="grid grid-cols-2 gap-3"><Field label="Tarih"><input type="date" className={inp} value={form.tarih} onChange={e=>setForm({...form,tarih:e.target.value})} required/></Field><Field label="Fiş No"><input className={inp} value={form.fisNo} onChange={e=>setForm({...form,fisNo:e.target.value})}/></Field><Field label="Açıklama" className="col-span-2"><input className={inp} value={form.aciklama} onChange={e=>setForm({...form,aciklama:e.target.value})}/></Field><Field label="Teslim Alan"><input className={inp} value={form.teslimAlan} onChange={e=>setForm({...form,teslimAlan:e.target.value})}/></Field><Field label="Miktar"><input type="number" step="0.01" className={inp} value={form.miktar} onChange={e=>setForm({...form,miktar:e.target.value})}/></Field><Field label="Fiyat"><input type="number" step="0.01" className={inp} value={form.fiyat} onChange={e=>setForm({...form,fiyat:e.target.value})}/></Field><Field label="Alınan"><input type="number" step="0.01" className={inp} value={form.alinan} onChange={e=>setForm({...form,alinan:e.target.value})}/></Field><Field label="Verilen"><input type="number" step="0.01" className={inp} value={form.verilen} onChange={e=>setForm({...form,verilen:e.target.value})}/></Field><div className="col-span-2"><FormActions onCancel={()=>setOpen(false)}/></div></form></Modal>
<Confirm open={!!del} title="Sil" text="Kayıt silinecek." onNo={()=>setDel(null)} onYes={async()=>{await d.actions.deleteSanayi(del.id);setDel(null);toast("Silindi.")}}/>
</div>)}
function TesisPage(){const d=useData();const toast=useToast();const[open,setOpen]=useState(false);const[edit,setEdit]=useState(null);const[del,setDel]=useState(null);
const blank={tarih:todayISO(),baslamaSaati:"07:00",paydosSaati:"18:00",ekSaat:"",ekSaatAciklama:"",aciklamalar:[]};const[form,setForm]=useState(blank);const[yeniAck,setYeniAck]=useState("");
const rows=sortByDate(d.tesis);
const cols=[{key:"tarih",header:"Tarih",get:r=>formatDateTR(r.tarih),excel:r=>formatDateTR(r.tarih)},{key:"baslamaSaati",header:"Başlama",excel:"baslamaSaati"},{key:"paydosSaati",header:"Paydos",excel:"paydosSaati"},{key:"ekSaat",header:"Ek Saat (Manuel)",render:r=>r.ekSaat||"-",excel:"ekSaat"},{key:"aciklamalar",header:"Açıklamalar",render:r=>(r.aciklamalar||[]).join(" | ")||"-",excel:r=>(r.aciklamalar||[]).join(" | ")}];
function startNew(){setEdit(null);setForm(blank);setYeniAck("");setOpen(true)}
return(<div className="fade-in"><PageHead title="Tesis Çalışma Bilgisi" desc="Günlük tek kayıt • Ek saat satırı manuel girilir" cards={[<StatCard key="n" dark label="Kayıt Sayısı" value={rows.length}/>]}/>
<div className="mb-3 bg-white border border-slate-200 rounded-xl p-3 shadow-soft flex justify-end"><button className={btnP} onClick={startNew}><Icon name="plus" className="w-4 h-4"/> Yeni Kayıt</button></div>
<DataTable columns={cols} rows={rows} actions={r=>(<div className="flex justify-end gap-1"><button className={btnS+" px-2 py-1"} onClick={()=>{setEdit(r.id);setForm({baslamaSaati:"",paydosSaati:"",ekSaat:"",ekSaatAciklama:"",aciklamalar:[],...r});setOpen(true)}}><Icon name="edit" className="w-4 h-4"/></button><button className={btnD+" px-2 py-1"} onClick={()=>setDel(r)}><Icon name="trash" className="w-4 h-4"/></button></div>)}/>
<Modal open={open} title="Tesis Çalışma Kaydı" onClose={()=>setOpen(false)}><form onSubmit={async e=>{e.preventDefault();try{await d.actions.saveTesis(form,edit);toast("Kaydedildi.");setOpen(false)}catch(err){toast(err.message,"err")}}} className="space-y-3">
<Field label="Tarih"><input type="date" className={inp} value={form.tarih} onChange={e=>setForm({...form,tarih:e.target.value})} required/></Field>
<div className="grid grid-cols-2 gap-2"><Field label="İşe Başlama Saati"><input type="time" className={inp} value={form.baslamaSaati} onChange={e=>setForm({...form,baslamaSaati:e.target.value})}/></Field><Field label="Paydos Saati"><input type="time" className={inp} value={form.paydosSaati} onChange={e=>setForm({...form,paydosSaati:e.target.value})}/></Field></div>
<div className="rounded-xl border-2 border-dashed border-slate-900/20 bg-slate-50 p-3"><div className="text-[12px] font-extrabold text-slate-900 mb-2">+ EK SAAT SATIRI (MANUEL)</div><div className="grid grid-cols-1 sm:grid-cols-2 gap-2"><Field label="Ek Saat (manuel yazın — örn: 18:30 - 21:00)"><input className={inp} placeholder="örn: 19:00 - 22:00 gece mesaisi" value={form.ekSaat||""} onChange={e=>setForm({...form,ekSaat:e.target.value})}/></Field><Field label="Ek Saat Açıklaması (manuel)"><input className={inp} placeholder="örn: Kırıcı bakımı, yükleme..." value={form.ekSaatAciklama||""} onChange={e=>setForm({...form,ekSaatAciklama:e.target.value})}/></Field></div></div>
<div><div className="text-xs font-bold text-slate-700 mb-1">Açıklamalar (birden fazla, alt alta)</div>{(form.aciklamalar||[]).map((a,i)=>(<div key={i} className="flex items-center justify-between bg-slate-50 border rounded-lg px-3 py-1.5 text-sm mb-1"><span>{a}</span><button type="button" className="text-rose-600 font-bold" onClick={()=>setForm({...form,aciklamalar:form.aciklamalar.filter((_,x)=>x!==i)})}>×</button></div>))}<div className="flex gap-2"><input className={inp} value={yeniAck} onChange={e=>setYeniAck(e.target.value)} placeholder="Açıklama yazıp Ekle'ye basın"/><button type="button" className={btnS} onClick={()=>{if(!yeniAck.trim())return;setForm({...form,aciklamalar:[...(form.aciklamalar||[]),yeniAck.trim()]});setYeniAck("")}}>Ekle</button></div></div>
<FormActions onCancel={()=>setOpen(false)}/></form></Modal>
<Confirm open={!!del} title="Sil" text="Kayıt silinecek." onNo={()=>setDel(null)} onYes={async()=>{await d.actions.deleteTesis(del.id);setDel(null);toast("Silindi.")}}/>
</div>)}
function FirmaPage(){const d=useData();const toast=useToast();const[f,setF]=useState({ad:"",adres:"",telefon:"",vkn:"",yetkili:"",email:"",aciklama:""});const[logoPrev,setLogoPrev]=useState("");const logoRef=useRef(null);
useEffect(()=>{if(d.firma){setF({ad:d.firma.ad||"",adres:d.firma.adres||"",telefon:d.firma.telefon||"",vkn:d.firma.vkn||"",yetkili:d.firma.yetkili||"",email:d.firma.email||"",aciklama:d.firma.aciklama||""});setLogoPrev(d.firma.logoData||"")}},[d.firma]);
function handleLogo(e){const file=e.target.files[0];if(!file)return;if(!file.type.startsWith("image/")){toast("Yalnızca resim dosyası seçin.","err");return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const max=320;let w=img.width,h=img.height;if(w>max){h=h*max/w;w=max}if(h>max){w=w*max/h;h=max}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);const data=c.toDataURL("image/png");setLogoPrev(data);toast("Logo hazır. Kaydet'e basın.")};img.src=reader.result};reader.readAsDataURL(file)}
return(<div className="fade-in"><PageHead title="Ayarlar / Firma Bilgileri" desc="Logo dosya olarak yüklenir • Yan menü ve giriş ekranında görünür" cards={[<StatCard key="k" dark label="Kasa" value={money(d.kasaBakiye)}/>]}/>
<div className="grid gap-3 lg:grid-cols-3">
<div className="rounded-2xl bg-white border border-slate-200 p-5 shadow-soft"><div className="font-extrabold mb-1">Firma Logosu</div><p className="text-xs text-slate-500 mb-3">Dosya seçin (PNG/JPG). URL değil, dosya olarak yüklenir.</p><div className="flex flex-col items-center gap-3"><div className="h-32 w-32 rounded-2xl bg-slate-900 flex items-center justify-center overflow-hidden border border-slate-200">{logoPrev?<img src={logoPrev} className="h-full w-full object-contain bg-white"/>:<span className="text-white font-extrabold text-3xl">M</span>}</div><input ref={logoRef} type="file" accept="image/*" className="hidden" onChange={handleLogo}/><div className="flex gap-2"><button className={btnP} onClick={()=>logoRef.current.click()}>Logo Ekle / Değiştir</button>{logoPrev&&<button className={btnD} onClick={()=>setLogoPrev("")}>Kaldır</button>}</div></div>
<div className="mt-4 rounded-xl bg-blue-50 border border-blue-100 p-3 text-xs text-blue-900">Logo, Firestore Firma kaydında saklanır ve tüm cihazlarda otomatik görünür.</div></div>
<div className="lg:col-span-2 rounded-2xl bg-white border border-slate-200 p-5 shadow-soft"><form onSubmit={async e=>{e.preventDefault();try{await d.actions.saveFirma({...f,logoData:logoPrev});toast("Firma bilgileri kaydedildi.")}catch(err){toast(err.message,"err")}}} className="grid grid-cols-1 sm:grid-cols-2 gap-3"><Field label="Firma Adı" className="sm:col-span-2"><input className={inp} value={f.ad} onChange={e=>setF({...f,ad:e.target.value})}/></Field><Field label="Telefon"><input className={inp} value={f.telefon} onChange={e=>setF({...f,telefon:e.target.value})}/></Field><Field label="VKN/TCKN"><input className={inp} value={f.vkn} onChange={e=>setF({...f,vkn:e.target.value})}/></Field><Field label="Yetkili"><input className={inp} value={f.yetkili} onChange={e=>setF({...f,yetkili:e.target.value})}/></Field><Field label="E-posta"><input className={inp} value={f.email} onChange={e=>setF({...f,email:e.target.value})}/></Field><Field label="Adres" className="sm:col-span-2"><input className={inp} value={f.adres} onChange={e=>setF({...f,adres:e.target.value})}/></Field><Field label="Açıklama" className="sm:col-span-2"><input className={inp} value={f.aciklama} onChange={e=>setF({...f,aciklama:e.target.value})}/></Field><div className="sm:col-span-2 flex justify-end"><button className={btnP}>Kaydet</button></div></form></div>
</div></div>)}
function Shell({user}){const d=useData();const[active,setActive]=useState("dashboard");const[tabs,setTabs]=useState(["dashboard"]);const[sideOpen,setSideOpen]=useState(false);
function open(id){setActive(id);setTabs(t=>t.includes(id)?t:[...t,id]);setSideOpen(false)}
function closeTab(id){if(id==="dashboard")return;setTabs(t=>t.filter(x=>x!==id));if(active===id)setActive("dashboard")}
function closeAll(){setTabs(["dashboard"]);setActive("dashboard")}
const modLabel=id=>(MODULES.find(m=>m.id===id)||{}).label||id;
function renderPage(){if(active==="dashboard")return<Dashboard/>;if(active==="kantar")return<KantarPage/>;if(active==="cariler")return<CarilerPage/>;if(active==="gelirgider")return<GelirGiderPage/>;if(active==="kasa")return<KasaPage/>;if(active==="yakit")return<YakitPage/>;if(active==="personel")return<PersonelPage/>;if(active==="faturalar")return<FaturalarPage/>;if(active==="irsaliyeler")return<IrsaliyelerPage/>;if(active==="sevk")return<SevkPage/>;if(active==="sanayi")return<SanayiPage/>;if(active==="tesis")return<TesisPage/>;if(active==="firma")return<FirmaPage/>;return<Dashboard/>}
const logo=d.firma?.logoData;
return(<div className="flex h-full overflow-hidden">
{/* SIDEBAR light blue */}
<div className={`fixed lg:static z-[50] h-full w-[262px] shrink-0 sidebar-light border-r border-blue-100 flex flex-col transition-transform ${sideOpen?"translate-x-0":"-translate-x-full lg:translate-x-0"}`}>
<div className="relative p-4 pb-3 flex items-center gap-3 border-b border-blue-200/60">
<div className="h-11 w-11 rounded-xl overflow-hidden bg-slate-900 text-white flex items-center justify-center font-extrabold text-lg shrink-0 border border-slate-900">{logo?<img src={logo} className="h-full w-full object-contain bg-white"/>:"M"}</div>
<div className="min-w-0"><div className="font-extrabold text-[15px] text-slate-900 truncate">{d.firma?.ad||"Mıcır Ocağı ERP"}</div><div className="text-[11px] font-bold text-blue-800 tracking-wide">KURUMSAL • SAHA</div></div>
<button className="lg:hidden ml-auto p-1" onClick={()=>setSideOpen(false)}><Icon name="x"/></button>
</div>
<div className="relative flex-1 overflow-y-auto scroll-thin p-3 space-y-1">
<div className="px-2 pt-1 pb-2 text-[11px] font-extrabold tracking-widest text-slate-500">MODÜLLER</div>
{MODULES.map(m=>(<button key={m.id} onClick={()=>open(m.id)} className={`side-item w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[13.5px] font-semibold ${active===m.id?"active":"text-slate-700"}`}><span className={`ico flex h-8 w-8 items-center justify-center rounded-lg shrink-0 ${active===m.id?"":"bg-white border border-blue-100 text-blue-800"}`}><Icon name={m.icon} className="w-[18px] h-[18px]"/></span><span className="truncate">{m.label}</span>{active===m.id&&<span className="ml-auto h-2 w-2 rounded-full bg-blue-600"></span>}</button>))}
</div>
<div className="relative p-3 border-t border-blue-200/60">
<div className="rounded-xl bg-slate-900 text-white p-3 flex items-center justify-between"><div><div className="text-[11px] text-white/60 font-bold">KASA</div><div className="font-extrabold">{money(d.kasaBakiye)}</div></div><div className="h-8 w-8 rounded-lg bg-white/10 flex items-center justify-center"><Icon name="wallet" className="w-4 h-4"/></div></div>
<div className="mt-2 text-[11px] text-slate-500 text-center">v2.0 • Masaüstü öncelikli</div>
</div>
</div>
{sideOpen&&<div className="fixed inset-0 bg-slate-950/40 z-[40] lg:hidden" onClick={()=>setSideOpen(false)}></div>}
{/* MAIN */}
<div className="flex-1 flex flex-col min-w-0 bg-[#F3F6FA]">
{/* TOPBAR white with tabs aligned */}
<div className="bg-white border-b border-slate-200 shadow-soft">
<div className="dark-strip h-1 w-full"></div>
<div className="flex items-center gap-2 px-3 lg:px-5 py-2.5">
<button className="lg:hidden p-2 rounded-lg border border-slate-200" onClick={()=>setSideOpen(true)}><Icon name="menu" className="w-5 h-5"/></button>
<div className="flex items-center gap-1 overflow-x-auto scroll-thin flex-1 py-0.5">
{tabs.map(t=>(<div key={t} className={`top-tab flex items-center gap-2 whitespace-nowrap rounded-lg border px-3 py-1.5 text-[13px] font-bold cursor-pointer ${active===t?"active":"bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100"}`} onClick={()=>setActive(t)}><span className={`h-1.5 w-1.5 rounded-full ${active===t?"bg-emerald-400":"bg-blue-500"}`}></span>{modLabel(t)}{t!=="dashboard"&&<span className="ml-1 hover:text-rose-400" onClick={e=>{e.stopPropagation();closeTab(t)}}>×</span>}</div>))}
</div>
<button onClick={closeAll} title="Tüm sekmeleri kapat" className="hidden sm:inline-flex items-center gap-1.5 whitespace-nowrap rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-[12px] font-bold text-slate-700 hover:bg-slate-900 hover:text-white hover:border-slate-900">Tüm Sekmeleri Kapat</button>
<div className="flex items-center gap-2 pl-2 border-l border-slate-200">
<div className="hidden md:block text-right"><div className="text-[12px] font-extrabold text-slate-900 leading-tight max-w-[160px] truncate">{user.email}</div><div className="text-[11px] text-emerald-600 font-bold">● Çevrimiçi</div></div>
<div className="h-9 w-9 rounded-full bg-slate-900 text-white flex items-center justify-center font-extrabold">{(user.email||"U")[0].toUpperCase()}</div>
<button onClick={()=>auth.signOut()} className="rounded-lg bg-rose-50 border border-rose-100 text-rose-700 p-2 hover:bg-rose-600 hover:text-white" title="Çıkış"><Icon name="logout" className="w-4 h-4"/></button>
</div>
</div>
</div>
<div className="flex-1 overflow-y-auto scroll-thin p-3 lg:p-5"><div className="max-w-[1280px] mx-auto bg-white border border-slate-200 rounded-2xl shadow-soft p-4 lg:p-6 min-h-full">{renderPage()}</div></div>
</div>
</div>)}
function App(){const[user,setUser]=useState(null);const[loading,setLoading]=useState(true);
useEffect(()=>auth.onAuthStateChanged(u=>{setUser(u);setLoading(false)}),[]);
if(loading)return<div className="h-full flex items-center justify-center bg-[#E9EFF7]"><div className="font-bold text-slate-700">Yükleniyor...</div></div>;
return(<ToastProvider>{!user?<LoginPage/>:<DataProvider user={user}><Shell user={user}/></DataProvider>}</ToastProvider>)}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
